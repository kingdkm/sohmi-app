<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOHMI Admin Dashboard</title>
  <link rel="stylesheet" href="css/sohmi.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">SOHMI</div>
      <div class="brand-sub">Admin Panel</div>
      <nav>
        <a class="active" href="dashboard.html">Dashboard</a>
        <a href="pages/staff.html">Staff</a>
        <a href="pages/student.html">Students</a>
        <a href="pages/packages.html">Packages</a>
      </nav>
      <button id="logoutBtn" class="ghost sidebar-logout">Sign Out</button>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><h1>Dashboard</h1><p class="muted">Sounds Of Heaven Music Institute</p></div>
        <div id="userEmail" class="user-pill"></div>
      </header>
      <section class="cards">
        <div class="stat"><span>Staff</span><strong id="staffCount">—</strong></div>
        <div class="stat"><span>Teachers</span><strong id="teacherCount">—</strong></div>
        <div class="stat"><span>Active Staff</span><strong id="activeCount">—</strong></div>
        <div class="stat"><span>Branches</span><strong id="branchCount">—</strong></div>
      </section>
      <section class="panel">
        <div class="panel-head">
          <div><h2>Staff Management</h2><p class="muted">Add, edit and deactivate staff from the Admin Panel.</p></div>
          <a class="primary button-link" href="pages/staff.html">Open Staff Management</a>
        </div>
      </section>
      <p id="dashboardMessage" class="message"></p>
    </main>
  </div>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
