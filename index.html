<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOHMI Admin</title>
  <link rel="stylesheet" href="css/sohmi.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark">SOHMI</div>
    <h1>Sounds Of Heaven Music Institute</h1>
    <p class="muted">Admin Portal</p>
    <form id="loginForm">
      <label>Email<input id="email" type="email" autocomplete="username" required></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">Sign In</button>
      <p id="loginMessage" class="message"></p>
    </form>
  </main>
  <script type="module" src="js/login.js"></script>
</body>
</html>
